# 매일 새벽 4시(한국 시간)에 공공서비스 데이터를 새로 받아 index.html을 다시 만든다.
# index.html이 바뀌면 커밋하고, Vercel이 그 커밋을 보고 자동으로 다시 배포한다.
# 필요한 설정: 저장소 Settings > Secrets and variables > Actions 에 DATA_GO_KR_KEY (공공데이터포털 디코딩 키)
name: 데이터 매일 갱신

on:
  schedule:
    - cron: "0 19 * * *"   # UTC 19:00 = 한국 시간 04:00
  workflow_dispatch:        # Actions 탭에서 직접 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 데이터 받기 → 가공 → 페이지 만들기
        shell: powershell
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          DATA_DIR: ${{ runner.temp }}\data
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          .\fetch.ps1
          .\prepare.ps1
          .\build.ps1

      - name: 바뀐 index.html 커밋
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
            exit 0
          fi
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
